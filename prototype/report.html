<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>诊断报告 - 组织活力小测试</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: #f3f4f6; padding-top: 48px !important; }
        .score-card { background: white; border-radius: 16px; padding: 24px; text-align: center; margin-bottom: 16px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); }
        .score-circle {
            width: 120px; height: 120px; border-radius: 50%; border: 8px solid #0052d9;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 16px; position: relative;
        }
        .score-val { font-size: 36px; font-weight: bold; color: #0052d9; }
        .score-label { font-size: 14px; color: #666; margin-top: 4px; }
        .sub-score { display: flex; justify-content: space-around; margin-top: 24px; border-top: 1px solid #eee; padding-top: 16px; }
        .sub-item { text-align: center; }
        .sub-val { font-size: 20px; font-weight: 600; color: #333; }
        .sub-name { font-size: 12px; color: #888; margin-top: 4px; }
        .btn-primary { 
            background: #0052d9; color: white; width: 100%; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: 600;
            transition: opacity 0.2s; border: none; outline: none;
        }
        .btn-primary:active { opacity: 0.8; }
    </style>
</head>
<body class="p-4 flex flex-col min-h-screen">

    <div class="flex-1">
        <div class="text-center mb-6 mt-4">
            <h2 class="text-lg font-semibold text-gray-800">组织活力诊断报告</h2>
            <p class="text-xs text-gray-500 mt-1">从个人活力、团队活力、组织活力三个维度进行诊断</p>
        </div>
        
        <div class="score-card">
            <h3 class="text-lg font-bold text-gray-900 mb-6">某某 科技有限公司</h3>
            
            <div class="flex flex-col items-center">
                <div class="relative">
                     <!-- 模拟环形进度条 -->
                    <div class="score-circle">
                        <span class="score-val">80.5</span>
                    </div>
                </div>
                <span class="text-sm font-medium text-gray-600">组织活力总分</span>
            </div>

            <div class="sub-score">
                <div class="sub-item">
                    <div class="sub-val">4.2</div>
                    <div class="sub-name">个人活力</div>
                </div>
                <div class="sub-item">
                    <div class="sub-val">3.8</div>
                    <div class="sub-name">团队活力</div>
                </div>
                <div class="sub-item">
                    <div class="sub-val">4.0</div>
                    <div class="sub-name">组织平均</div>
                </div>
            </div>
        </div>

        <div class="bg-blue-50 p-4 rounded-lg border border-blue-100 mb-4">
            <div class="flex items-start">
                <span class="text-xl mr-2">💡</span>
                <p class="text-sm text-blue-800 leading-relaxed">
                    您的组织活力处于中等偏上水平，建议重点关注团队协作效率，提升组织响应速度。
                </p>
            </div>
        </div>
    </div>

    <!-- 底部按钮区 -->
    <div class="mt-auto pt-4">
        <button class="btn-primary shadow-lg" onclick="window.location.href='advice.html'">
            生成诊断报告与建议
        </button>
    </div>

</body>
</html>
