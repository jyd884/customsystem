<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>组织活力小测试 - 原型展示</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f0f2f5; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        
        .device-mockup {
            width: 393px;
            height: 852px;
            border: 14px solid #1f1f1f;
            border-radius: 50px;
            background-color: #1f1f1f;
            position: relative;
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.3);
            margin: 20px;
            overflow: hidden;
            flex-shrink: 0;
        }

        /* Dynamic Island simulation */
        .dynamic-island {
            position: absolute;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 35px;
            background-color: #000;
            border-radius: 20px;
            z-index: 50;
        }

        .device-iframe {
            width: 100%;
            height: 100%;
            border: none;
            background-color: white;
            border-radius: 36px; /* slightly less than device radius */
        }
        
        .section-header {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin: 40px 20px 20px;
            border-left: 5px solid #0052d9;
            padding-left: 15px;
        }

        .web-mockup {
            width: 100%;
            max-width: 1200px;
            height: 800px;
            border: 1px solid #dcdcdc;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            margin: 20px auto 60px;
            background: white;
            display: flex;
            flex-direction: column;
        }

        .browser-bar {
            height: 40px;
            background: #f1f3f4;
            display: flex;
            align-items: center;
            padding: 0 16px;
            border-bottom: 1px solid #e0e0e0;
        }

        .browser-dots {
            display: flex;
            gap: 6px;
        }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: #ccc; }
        .dot.red { background: #ff5f57; }
        .dot.yellow { background: #ffbd2e; }
        .dot.green { background: #28c940; }

        .web-iframe {
            flex: 1;
            border: none;
            width: 100%;
        }

        .prototype-label {
            text-align: center;
            margin-top: 15px;
            font-weight: 600;
            color: #555;
            font-size: 16px;
        }
    </style>
</head>
<body class="pb-20">

    <div class="text-center py-10">
        <h1 class="text-4xl font-bold text-gray-800">组织活力诊断系统 - 原型设计</h1>
        <p class="text-gray-500 mt-2">基于 TDesign 风格设计的移动端小程序与后台管理系统</p>
    </div>

    <!-- Mobile Prototypes -->
    <div class="section-header">1. 小程序端界面流程</div>
    
    <div class="flex flex-wrap justify-center items-start gap-8 px-4 overflow-x-auto pb-8">
        
        <!-- Login -->
        <div>
            <div class="device-mockup">
                <div class="dynamic-island"></div>
                <iframe src="login.html" class="device-iframe"></iframe>
            </div>
            <div class="prototype-label">1. 登录/信息录入页</div>
        </div>

        <!-- Survey -->
        <div>
            <div class="device-mockup">
                <div class="dynamic-island"></div>
                <iframe src="survey.html" class="device-iframe"></iframe>
            </div>
            <div class="prototype-label">2. 问卷测评页</div>
        </div>

        <!-- Report -->
        <div>
            <div class="device-mockup">
                <div class="dynamic-island"></div>
                <iframe src="report.html" class="device-iframe"></iframe>
            </div>
            <div class="prototype-label">3. 诊断报告页</div>
        </div>

        <!-- Advice -->
        <div>
            <div class="device-mockup">
                <div class="dynamic-island"></div>
                <iframe src="advice.html" class="device-iframe"></iframe>
            </div>
            <div class="prototype-label">4. 优化建议页</div>
        </div>

    </div>

    <!-- Web Backend Prototype -->
    <div class="section-header">2. 后台管理端界面</div>

    <div class="px-8">
        <div class="web-mockup">
            <div class="browser-bar">
                <div class="browser-dots">
                    <div class="dot red"></div>
                    <div class="dot yellow"></div>
                    <div class="dot green"></div>
                </div>
                <div class="ml-4 flex-1 bg-white h-6 rounded px-2 text-xs flex items-center text-gray-400">
                    https://admin.ocs-system.com/dashboard/users
                </div>
            </div>
            <iframe src="admin.html" class="web-iframe"></iframe>
        </div>
        <div class="text-center font-medium text-gray-600 mb-10">后台数据管理面板</div>
    </div>

</body>
</html>
